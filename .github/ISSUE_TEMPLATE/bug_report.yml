name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IdleWalker version
      description: The output of `idlewalker --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux on X11
        - Linux on Wayland
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS version and desktop
      description: For example Windows 11 24H2, or Ubuntu 24.04 with GNOME
