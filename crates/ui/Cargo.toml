[package]
name = "idlewalker-ui"
description = "IdleWalker's presentation: the frame loop, tray menu, cards and dialogs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
idlewalker-domain.workspace = true
idlewalker-rendering.workspace = true
idlewalker-application.workspace = true
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"
epaint_default_fonts = "0.31"
png = "0.17"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
