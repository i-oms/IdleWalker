[package]
name = "idlewalker-platform"
description = "IdleWalker's adapters: per-OS services, files and the network."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
idlewalker-domain.workspace = true
idlewalker-rendering.workspace = true
idlewalker-application.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "shape", "xtest", "screensaver"] }
